name: Publish Offline Safe Release

on:
  push:
    paths:
      - '.github/workflows/release-offline-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v2026.09.13-offline-safe
      PROJECT: .\src\Leigod_Auto_Pause\Leigod_Auto_Pause.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check existing release
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            'exists=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $sourceCommit = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" --jq '.target_commitish'
            "source_commit=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'exists=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "source_commit=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          exit 0

      - name: Setup .NET 8
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.release_check.outputs.exists != 'true'
        run: dotnet restore $env:PROJECT -r win-x64

      - name: Publish self-contained single-file EXE
        if: steps.release_check.outputs.exists != 'true'
        run: dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\publish --no-restore

      - name: Package and generate checksums
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $exe = '.\publish\Leigod_Auto_Pause.exe'
          if (-not (Test-Path $exe)) { throw "Missing build output: $exe" }

          $zip = '.\Leigod_Auto_Pause_offline-safe_win-x64.zip'
          Compress-Archive -Path $exe -DestinationPath $zip -Force

          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  Leigod_Auto_Pause.exe"
            "$zipHash  Leigod_Auto_Pause_offline-safe_win-x64.zip"
          ) | Set-Content -Path '.\SHA256SUMS.txt' -Encoding ascii

      - name: Generate release notes
        shell: pwsh
        run: |
          $notes = @'
          ## Offline Safe 安全版

          这是 `DarkKnight24/Leigod_Auto_Pause` 的离线安全构建。

          ### 主要安全改造

          - 删除启动器运行时从 GitHub / Gitee 下载 `main.js` 的行为。
          - `main.js` 在编译阶段作为 Embedded Resource 嵌入 EXE。
          - 运行时仅使用 EXE 内置插件代码。
          - 不再记录 `account_token` 的前 10 个字符。
          - ASAR 使用临时文件事务式重打包，成功后才覆盖正式 `app.asar`。
          - 改进 `app.asar.bak` / `app.asar.bak.previous` 备份策略。
          - Windows x64、.NET 8、自包含单文件构建。

          ### 附件

          - `Leigod_Auto_Pause.exe`：可直接使用的自包含单文件版本。
          - `Leigod_Auto_Pause_offline-safe_win-x64.zip`：EXE 压缩包。
          - `SHA256SUMS.txt`：上述两个文件的 SHA-256 校验值。

          ### 使用方式

          将 `Leigod_Auto_Pause.exe` 放到雷神加速器安装目录（与 `leigod_launcher.exe` 同级，目录内存在 `resources\app.asar`），然后以管理员身份运行。

          > 此版本移除的是第三方代码仓库动态下载带来的供应链风险。插件自身为了实现自动暂停功能，仍会访问雷神官方 API，并修改雷神客户端的 `app.asar`。
          '@
          $sourceCommit = '${{ steps.release_check.outputs.source_commit }}'
          $notes += "`r`n`r`nSource commit: $sourceCommit`r`n"
          Set-Content -Path '.\RELEASE_NOTES.md' -Value $notes -Encoding utf8

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ steps.release_check.outputs.exists }}' -eq 'true') {
            gh release edit $env:RELEASE_TAG `
              --title 'Leigod Auto Pause — Offline Safe' `
              --notes-file '.\RELEASE_NOTES.md'
          } else {
            gh release create $env:RELEASE_TAG `
              '.\publish\Leigod_Auto_Pause.exe' `
              '.\Leigod_Auto_Pause_offline-safe_win-x64.zip' `
              '.\SHA256SUMS.txt' `
              --target $env:GITHUB_SHA `
              --title 'Leigod Auto Pause — Offline Safe' `
              --notes-file '.\RELEASE_NOTES.md'
          }

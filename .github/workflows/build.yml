name: Build

on:
  push:
    branches:
      - main
      - security/offline-embedded-plugin
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\src\Leigod_Auto_Pause\Leigod_Auto_Pause.csproj -r win-x64

      - name: Build
        run: dotnet build .\src\Leigod_Auto_Pause\Leigod_Auto_Pause.csproj -c Release -r win-x64 --no-restore

      - name: Publish single-file launcher
        run: dotnet publish .\src\Leigod_Auto_Pause\Leigod_Auto_Pause.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\publish --no-restore
